openapi: 3.1.0
info: {title: Mini-Inference Public API, version: 1.0.0}
servers: [{url: 'http://private-host:8888'}]
security: [{bearerAuth: []}]
paths:
  /v1/models:
    get:
      operationId: listModels
      responses: {'200': {description: Model list, content: {application/json: {schema: {$ref: '#/components/schemas/ModelList'}}}}, default: {$ref: '#/components/responses/Error'}}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChatRequest'}}}}
      responses: {'200': {description: Completion or SSE stream}, default: {$ref: '#/components/responses/Error'}}
  /v1/completions:
    post:
      operationId: createCompletion
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompletionRequest'}}}}
      responses: {'200': {description: Completion or SSE stream}, default: {$ref: '#/components/responses/Error'}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  responses: {Error: {description: Safe error, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}}
  schemas:
    ErrorEnvelope: {type: object, additionalProperties: false, required: [error], properties: {error: {type: object, additionalProperties: false, required: [message, type, code, param, request_id, retryable, retry_after_seconds], properties: {message: {type: string}, type: {type: string}, code: {type: string}, param: {type: [string, 'null']}, request_id: {type: string, format: uuid}, retryable: {type: boolean}, retry_after_seconds: {type: [integer, 'null']}}}}}
    ModelList: {type: object, additionalProperties: false, required: [object, data], properties: {object: {const: list}, data: {type: array, maxItems: 1, items: {type: object, additionalProperties: false, required: [id, object, created, owned_by], properties: {id: {const: openbmb/MiniCPM5-2B-Q4_K_M}, object: {const: model}, created: {const: 0}, owned_by: {const: openbmb}}}}}}
    GenerationBase: {type: object, properties: {model: {const: openbmb/MiniCPM5-2B-Q4_K_M}, stream: {type: boolean, default: false}, max_tokens: {type: integer, minimum: 1, maximum: 131072, default: 2048}, temperature: {type: number, minimum: 0, maximum: 2, default: 0.8}, top_p: {type: number, exclusiveMinimum: 0, maximum: 1, default: 1}, stop: {oneOf: [{type: string, minLength: 1, maxLength: 256}, {type: array, minItems: 1, maxItems: 4, items: {type: string, minLength: 1, maxLength: 256}}]}, presence_penalty: {type: number, minimum: -2, maximum: 2, default: 0}, frequency_penalty: {type: number, minimum: -2, maximum: 2, default: 0}, reasoning: {type: boolean, default: true}}}
    ToolCall: {type: object, additionalProperties: false, required: [id, type, function], properties: {id: {type: string, minLength: 1}, type: {const: function}, function: {type: object, additionalProperties: false, required: [name, arguments], properties: {name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}, arguments: {type: string}}}}}
    Message: {oneOf: [{type: object, additionalProperties: false, required: [role, content], properties: {role: {enum: [system, user]}, content: {type: string, minLength: 1}}}, {type: object, additionalProperties: false, required: [role, content], properties: {role: {const: assistant}, content: {type: [string, 'null']}, tool_calls: {type: array, items: {$ref: '#/components/schemas/ToolCall'}}}}, {type: object, additionalProperties: false, required: [role, content, tool_call_id], properties: {role: {const: tool}, content: {type: string}, tool_call_id: {type: string, minLength: 1}}}]}
    Tool: {type: object, additionalProperties: false, required: [type, function], properties: {type: {const: function}, function: {type: object, additionalProperties: false, required: [name, parameters], properties: {name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}, description: {type: string, maxLength: 1024}, parameters: {type: object}}}}}
    ToolChoice: {oneOf: [{enum: [auto, none]}, {type: object, additionalProperties: false, required: [type, function], properties: {type: {const: function}, function: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}}}}]}
    ChatRequest: {allOf: [{$ref: '#/components/schemas/GenerationBase'}, {type: object, additionalProperties: false, required: [model, messages], properties: {model: {const: openbmb/MiniCPM5-2B-Q4_K_M}, messages: {type: array, minItems: 1, maxItems: 256, items: {$ref: '#/components/schemas/Message'}}, stream: {type: boolean}, max_tokens: {type: integer}, temperature: {type: number}, top_p: {type: number}, stop: {}, presence_penalty: {type: number}, frequency_penalty: {type: number}, reasoning: {type: boolean}, tools: {type: array, minItems: 1, maxItems: 64, items: {$ref: '#/components/schemas/Tool'}}, tool_choice: {$ref: '#/components/schemas/ToolChoice'}}}]}
    CompletionRequest: {allOf: [{$ref: '#/components/schemas/GenerationBase'}, {type: object, additionalProperties: false, required: [model, prompt], properties: {model: {const: openbmb/MiniCPM5-2B-Q4_K_M}, prompt: {type: string, minLength: 1}, stream: {type: boolean}, max_tokens: {type: integer}, temperature: {type: number}, top_p: {type: number}, stop: {}, presence_penalty: {type: number}, frequency_penalty: {type: number}, reasoning: {type: boolean}}}]}

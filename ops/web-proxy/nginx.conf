worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe_json escape=json '{"timestamp":"$time_iso8601","level":"info","service":"web","event":"http_access","method":"$request_method","route":"$safe_route","status":$status,"duration_seconds":$request_time,"response_bytes":$body_bytes_sent}';
  access_log /dev/stdout safe_json;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;

  map $uri $safe_route {
    default rejected;
    / admin_ui;
    /healthz health;
    /admin/v1/snapshot admin_snapshot;
    /admin/v1/requests admin_requests;
    /admin/v1/metrics admin_metrics;
    /admin/v1/alerts admin_alerts;
    /admin/v1/logs admin_logs;
    /admin/v1/operations admin_operations;
    /admin/v1/events admin_events;
    /admin/v1/model/start model_start;
    /admin/v1/model/stop model_stop;
    /admin/v1/model/name model_name;
    "~^/admin/v1/queue/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/cancel$" queue_cancel;
    ~^/assets/ static_asset;
  }

  upstream admin_api { server api:8889; keepalive 8; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 204; }
    location ^~ /health/ { return 404; }
    location ^~ /internal/ { return 404; }

    location = /admin/v1/events {
      limit_except GET { deny all; }
      proxy_pass http://admin_api;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Connection '';
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_pass_request_body off;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 45s;
      proxy_send_timeout 45s;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control 'no-cache, no-transform' always;
    }

    location ~ ^/admin/v1/(snapshot|requests|metrics|alerts|logs|operations)$ {
      limit_except GET { deny all; }
      proxy_pass http://admin_api;
      proxy_pass_request_headers off;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header If-None-Match $http_if_none_match;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_pass_request_body off;
      proxy_buffering off;
    }

    location = /admin/v1/model/start {
      limit_except POST { deny all; }
      proxy_pass http://admin_api;
      proxy_pass_request_headers off;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
    }
    location = /admin/v1/model/stop {
      limit_except POST { deny all; }
      proxy_pass http://admin_api;
      proxy_pass_request_headers off;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
    }
    location = /admin/v1/model/name {
      limit_except POST { deny all; }
      client_max_body_size 1k;
      proxy_pass http://admin_api;
      proxy_pass_request_headers off;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $content_length;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_request_buffering on;
    }
    location ~ "^/admin/v1/queue/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/cancel$" {
      limit_except POST { deny all; }
      proxy_pass http://admin_api;
      proxy_pass_request_headers off;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_pass_request_body off;
      proxy_set_header Content-Length '';
    }
    location /admin/ { return 404; }

    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
    location = / { try_files /index.html =404; add_header Cache-Control 'no-store'; }
    location = /requests { try_files /index.html =404; add_header Cache-Control 'no-store'; }
    location = /metrics { try_files /index.html =404; add_header Cache-Control 'no-store'; }
    location = /alerts { try_files /index.html =404; add_header Cache-Control 'no-store'; }
    location = /data { try_files /index.html =404; add_header Cache-Control 'no-store'; }
    location / { return 404; }
  }
}
